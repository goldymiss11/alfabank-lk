openapi: 3.0.3
info:
  title: Alfa-Bank Smart Credit Conveyor API
  description: Полная спецификация REST API цифрового кредитного конвейера для малого и микробизнеса (Альфа-Хак 2026).
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Локальный сервер разработки
  - url: /api
    description: Относительный путь (через обратный прокси)

paths:
  /health:
    get:
      summary: Проверка работоспособности сервиса
      responses:
        '200':
          description: Сервер активен
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  active_preset: { type: string, example: "coffee_shop_ip" }
                  applications_count: { type: integer, example: 1 }

  /api/presets:
    get:
      summary: Список демонстрационных профилей (God-Bar)
      responses:
        '200':
          description: Список пресетов
          content:
            application/json:
              schema:
                type: object
                properties:
                  active_preset_id: { type: string }
                  presets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Preset'

  /api/presets/{preset_id}/activate:
    post:
      summary: Активация и загрузка синтетического пресета
      parameters:
        - name: preset_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Пресет активирован и прогнан через конвейер
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetLoadResponse'

  /api/presets/{preset_id}/load:
    post:
      summary: Алиас активации пресета
      parameters:
        - name: preset_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          $ref: '#/components/schemas/PresetLoadResponse'

  /api/applications:
    get:
      summary: Список всех заявок в системе
      responses:
        '200':
          description: Массив заявок
    post:
      summary: Создание новой кредитной заявки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_inn: { type: string }
                product_type: { type: string, enum: [OVERDRAFT, WORKING_CAPITAL_LOAN, REVOLVING_LINE_VKL, INVESTMENT_LOAN] }
                requested_amount: { type: number }
                requested_term_months: { type: integer }
                gov_program_id: { type: string, nullable: true }
      responses:
        '201':
          description: Заявка создана в статусе DRAFT

  /api/applications/{id}:
    get:
      summary: Получение полной информации по заявке
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Детали заявки с результатами скоринга, офферами и аудитом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'

    patch:
      summary: Обновление параметров черновика заявки
      description: Доступно только в статусе DRAFT. Валидирует лимиты и тип продукта, инвалидирует устаревший скоринг.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_type: { type: string, enum: [OVERDRAFT, WORKING_CAPITAL_LOAN, REVOLVING_LINE_VKL, INVESTMENT_LOAN] }
                requested_amount: { type: number, example: 1000000 }
                requested_term_months: { type: integer, example: 12 }
                gov_program_id: { type: string, nullable: true }
      responses:
        '200':
          description: Параметры черновика успешно сохранены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Некорректные параметры или тип продукта
        '404':
          description: Заявка не найдена
        '409':
          description: Заявка не находится в статусе DRAFT

  /api/applications/{id}/transition:
    post:
      summary: Выполнение перехода в графе состояний (FSM)
      description: Для триггера SIGN_CONTRACT необходимо использовать endpoint /api/applications/{id}/sign с OTP-кодом; прямой переход через этот endpoint запрещен.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trigger]
              properties:
                trigger: { type: string, enum: [SUBMIT, AUTO_VALIDATE, VALIDATION_PASSED, VALIDATION_FAILED, ENRICHMENT_COMPLETE, AUTO_APPROVE, COUNTER_OFFER_GENERATED, NEEDS_MANUAL_REVIEW, AUTO_REJECT, UNDERWRITER_APPROVE, UNDERWRITER_REJECT, REQUEST_CLARIFICATION, UNDERWRITER_COUNTER_OFFER, CLIENT_RESPONDED, RE_SCORE, ACCEPT_OFFER, DISBURSE, CANCEL, OFFERS_EXPIRED] }
                actor_type: { type: string }
                actor_id: { type: string, nullable: true }
                payload:
                  type: object
                  properties:
                    selected_offer_variant: { type: integer }
      responses:
        '200':
          description: Переход успешно выполнен

  /api/applications/{id}/enrich:
    post:
      summary: Запуск обогащения внешними источниками
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Данные получены из ФНС, ЕГРЮЛ, БКИ и выписок

  /api/applications/{id}/scoring:
    get:
      summary: Детализированный расчет кредитного скоринга
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Балл, PD, грейд и факторы влияния

  /api/applications/{id}/decision:
    get:
      summary: Кредитное решение и офферы
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Одобренная сумма, ставки, аннуитет и варианты офферов

  /api/applications/{id}/clarifications:
    post:
      summary: Запрос уточнений андеррайтером
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_text]
              properties:
                question_text: { type: string }
                required_document_type: { type: string }
      responses:
        '201':
          description: Уточнение создано, заявка переведена в NEED_CLARIFICATION

  /api/clarifications/{id}/respond:
    post:
      summary: Ответ клиента на запрос уточнения
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response_text]
              properties:
                response_text: { type: string }
                document_ids: { type: array, items: { type: string } }
      responses:
        '200':
          description: Ответ зафиксирован, заявка переведена в RESUBMITTED

  /api/applications/{id}/documents:
    post:
      summary: Загрузка подтверждающего документа
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                doc_type: { type: string, example: "OSV" }
                uploaded_by: { type: string, example: "CLIENT_OWNER" }
      responses:
        '201':
          description: Документ успешно загружен

  /api/applications/{id}/sign:
    post:
      summary: Подписание договора ПЭП (SMS OTP)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp_code]
              properties:
                otp_code: { type: string, example: "1234" }
      responses:
        '200':
          description: Договор подписан, заявка переведена в CONTRACT_SIGNED; финансирование выполняется отдельным переходом DISBURSE
          content:
            application/json:
              schema:
                type: object
                required: [application_id, state, message]
                properties:
                  application_id: { type: string }
                  state: { type: string, example: CONTRACT_SIGNED }
                  message: { type: string }
        '400':
          description: Некорректный JSON или неверный OTP-код
        '404':
          description: Заявка не найдена
        '409':
          description: Подписание недоступно из текущего состояния

  /api/applications/{id}/disburse:
    post:
      summary: Выдача кредитных средств (идемпотентная операция)
      description: Выполняет зачисление средств на расчетный счет. Доступно только в статусе CONTRACT_SIGNED. Повторные вызовы идемпотентны.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                actor_type: { type: string, example: "SYSTEM_CONVEYOR" }
      responses:
        '200':
          description: Средства успешно зачислены, статус переведён в FUNDED
          content:
            application/json:
              schema:
                type: object
                properties:
                  application_id: { type: string }
                  state: { type: string, example: FUNDED }
                  disbursed_at: { type: string, format: date-time }
                  message: { type: string }
        '404':
          description: Заявка не найдена
        '409':
          description: Заявка не находится в статусе CONTRACT_SIGNED

  /api/applications/{id}/delegate:
    post:
      summary: Делегирование заявки бухгалтеру
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                accountant_name: { type: string }
                accountant_email: { type: string }
      responses:
        '200':
          description: Заявка успешно делегирована

  /api/applications/{id}/apply-program:
    post:
      summary: Применение программы господдержки
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [news_item_id]
              properties:
                news_item_id: { type: string }
      responses:
        '200':
          description: Программа подключена, ставка снижена

  /api/underwriter/queue:
    get:
      summary: Очередь заявок на ручном рассмотрении аналитика
      responses:
        '200':
          description: Список заявок в статусах MANUAL_REVIEW, RESUBMITTED, NEED_CLARIFICATION

  /api/underwriter/applications/{id}/decide:
    post:
      summary: Принятие экспертного решения андеррайтером
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [APPROVE, REJECT, COUNTER_OFFER, REQUEST_CLARIFICATION] }
                comment: { type: string }
                override_offers:
                  type: array
                  description: Офферы, заданные андеррайтером для APPROVE или COUNTER_OFFER
                  items:
                    $ref: '#/components/schemas/CreditOffer'
      responses:
        '200':
          description: Решение зафиксировано
          content:
            application/json:
              schema:
                type: object
                required: [application_id, new_state, audit_log_entry_id, action, offers]
                properties:
                  application_id: { type: string }
                  new_state: { type: string }
                  audit_log_entry_id: { type: string }
                  action: { type: string }
                  offers:
                    type: array
                    items:
                      $ref: '#/components/schemas/CreditOffer'
        '400':
          description: Некорректное действие или параметры оффера
        '404':
          description: Заявка не найдена
        '409':
          description: Действие недоступно из текущего состояния

  /api/news:
    get:
      summary: Лента программ господдержки с фильтром по ОКВЭД
      parameters:
        - name: okved_prefix
          in: query
          schema: { type: string, default: "ALL" }
      responses:
        '200':
          description: Подходящие программы субсидий и гарантий

  /api/applications/{id}/audit:
    get:
      summary: Журнал событий заявки
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Записи аудита заявки
          content:
            application/json:
              schema:
                type: object
                required: [audit_log]
                properties:
                  audit_log:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'
        '404':
          description: Заявка не найдена

  /api/ai/recommend:
    post:
      summary: Алиас консультации AI-ассистента
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIChatRequest'
      responses:
        '200':
          description: Рекомендации и готовые подсказки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIChatResponse'
        '400':
          description: Некорректный запрос или пустое сообщение

  /api/mocks/{service}/{inn}:
    get:
      summary: Синтетический ответ mock-сервиса
      description: "Для service=news параметр inn фактически трактуется как префикс ОКВЭД."
      parameters:
        - name: service
          in: path
          required: true
          schema: { type: string, enum: [egrul, fns, bki, news] }
        - name: inn
          in: path
          required: true
          description: ИНН для egrul/fns/bki; префикс ОКВЭД для news
          schema: { type: string }
      responses:
        '200':
          description: Данные выбранного mock-сервиса
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MockEgrulResponse'
                  - $ref: '#/components/schemas/MockObjectResponse'
                  - $ref: '#/components/schemas/MockNewsResponse'
        '400':
          description: Не указан сервис или параметр пути
        '404':
          description: Mock-сервис не найден

  /api/ai/chat:
    post:
      summary: Консультация с AI-ассистентом
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIChatRequest'
      responses:
        '200':
          description: Ответ ассистента и готовые подсказки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIChatResponse'
        '400':
          description: Некорректный запрос или пустое сообщение

components:
  schemas:
    AuditLogEntry:
      type: object
      required: [id, application_id, from_state, to_state, trigger, actor_type, actor_id, details_json, created_at]
      properties:
        id: { type: string }
        application_id: { type: string }
        from_state: { type: string, nullable: true }
        to_state: { type: string }
        trigger: { type: string }
        actor_type: { type: string }
        actor_id: { type: string, nullable: true }
        details_json: { type: object, additionalProperties: true }
        created_at: { type: string }

    AIChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1 }
        application_id: { type: string, nullable: true }

    AIChatResponse:
      type: object
      required: [response, source, suggestions]
      properties:
        response: { type: string }
        source: { type: string, example: fallback }
        suggestions:
          type: array
          items: { type: string }
        context_hint: { type: string }

    MockEgrulResponse:
      type: object
      properties:
        inn: { type: string }
        ogrn: { type: string }
        name: { type: string }
        full_name: { type: string }
        legal_form: { type: string }
        okved_main: { type: string }
        registration_date: { type: string }
        authorized_capital: { type: number }
        employee_count: { type: integer }
        is_liquidating: { type: boolean }
        founders:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              share_pct: { type: number }

    MockObjectResponse:
      type: object
      description: Схема синтетических ответов FNS/BKI; поля определяются соответствующим enrichment-контрактом.
      additionalProperties: true

    MockNewsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
    CreditOffer:
      type: object
      required:
        - variant_index
        - product_type
        - approved_amount
        - term_months
        - annual_rate_pct
        - monthly_payment
        - collateral_required
        - description
      properties:
        variant_index: { type: integer, minimum: 1 }
        product_type: { type: string }
        approved_amount: { type: number, exclusiveMinimum: 0 }
        term_months: { type: integer, minimum: 1, maximum: 120 }
        annual_rate_pct: { type: number, minimum: 0, maximum: 100 }
        monthly_payment: { type: number, exclusiveMinimum: 0 }
        collateral_required: { type: boolean }
        collateral_description: { type: string, nullable: true }
        description: { type: string }

    Preset:
      type: object
      properties:
        preset_id: { type: string }
        label: { type: string }
        expected_outcome: { type: string }
        company_name: { type: string }
        inn: { type: string, nullable: true }
        description: { type: string }

    PresetLoadResponse:
      type: object
      properties:
        preset_id: { type: string }
        company_id: { type: string }
        owner_user_id: { type: string }
        accountant_user_id: { type: string }
        application_id: { type: string }
        current_state: { type: string }

    Application:
      type: object
      properties:
        id: { type: string }
        company: { type: object }
        product_type: { type: string }
        requested_amount: { type: number }
        requested_term_months: { type: integer }
        state: { type: string }
        scoring_result: { type: object, nullable: true }
        decision_result: { type: object, nullable: true }
        offers: { type: array, items: { type: object } }
        rehabilitation_plan: { type: object, nullable: true }
        audit_log: { type: array, items: { type: object } }
        clarifications: { type: array, items: { type: object } }
        documents: { type: array, items: { type: object } }
