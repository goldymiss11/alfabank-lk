name: alfabank-conveyor

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alfabank-conveyor-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - UPLOAD_DIR=/app/uploads
    volumes:
      - backend-uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alfabank-conveyor-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-uploads:
